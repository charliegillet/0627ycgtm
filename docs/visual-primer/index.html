<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BEACHHEAD Visual Primer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7fafc;
        --text: #102033;
        --muted: #526173;
        --border: #d8e0ea;
        --panel: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(1180px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 44px 0 72px;
      }
      header {
        margin-bottom: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 38px;
        line-height: 1.05;
        letter-spacing: 0;
      }
      p {
        max-width: 920px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.55;
      }
      section {
        margin-top: 32px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }
      h2 {
        margin: 0 0 12px;
        font-size: 22px;
        letter-spacing: 0;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
      }
      code {
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>BEACHHEAD Visual Primer</h1>
        <p>
          Three graphics for onboarding a new engineer to the current <code>horizon/</code> app:
          the system map, the signal journey, and the data/debug map.
        </p>
      </header>

      <section>
        <h2>1. System Map</h2>
        <img src="./01-system-map.svg" alt="BEACHHEAD system map" />
      </section>

      <section>
        <h2>2. Signal Journey</h2>
        <img src="./02-signal-journey.svg" alt="BEACHHEAD signal journey" />
      </section>

      <section>
        <h2>3. Data And Debug Map</h2>
        <img src="./03-data-debug-map.svg" alt="BEACHHEAD data and debug map" />
      </section>
    </main>
  </body>
</html>
