<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
  <title id="title">BEACHHEAD signal journey</title>
  <desc id="desc">End-to-end flow for a company signal through detect, enrich, score, act, and the UI.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6472; }
      .stepTitle { font: 800 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #344054; }
      .small { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6472; }
      .code { font: 650 12px "SF Mono", ui-monospace, Menlo, Consolas, monospace; fill: #243447; }
      .card { fill: #ffffff; stroke: #d5dce7; stroke-width: 2; }
      .lane { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #0284c7; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrowAmber { stroke: #d97706; stroke-width: 3; fill: none; marker-end: url(#arrowAmber); }
      .pill { font: 800 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: white; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="1020"/>
  <text class="title" x="60" y="64">The journey of one company signal</text>
  <text class="subtitle" x="60" y="96">Analogy: a domain becomes a case file. Three witnesses are interviewed before a rep is allowed to act.</text>

  <rect class="lane" x="60" y="140" width="1280" height="130" rx="14"/>
  <text class="stepTitle" x="90" y="180">1. DETECT: one shared front door</text>
  <text class="body" x="90" y="210">Cron, webhook, and browser entry all call the same internal mutation.</text>
  <text class="code" x="90" y="238">recordSignal(source, companyDomain, kind) -> signalEvents + runs + traces + scheduler</text>
  <rect x="1060" y="168" width="216" height="54" rx="9" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text class="body" x="1082" y="192">Dedupes same-day</text>
  <text class="code" x="1082" y="214">lib/idempotency.ts</text>

  <rect class="lane" x="60" y="310" width="1280" height="238" rx="14"/>
  <text class="stepTitle" x="90" y="350">2. ENRICH: interview three independent witnesses in parallel</text>
  <text class="body" x="90" y="380">The live path calls the provider router, which currently sends all convergence legs to Orange Slice.</text>
  <rect class="card" x="90" y="415" width="310" height="96" rx="12"/>
  <rect x="114" y="437" width="76" height="24" rx="12" fill="#0284c7"/>
  <text class="pill" x="132" y="454">FUND</text>
  <text class="body" x="114" y="482">Fresh funding recency</text>
  <text class="code" x="114" y="504">ageDays &lt;= 90 is strong</text>
  <rect class="card" x="450" y="415" width="310" height="96" rx="12"/>
  <rect x="474" y="437" width="76" height="24" rx="12" fill="#16a34a"/>
  <text class="pill" x="492" y="454">HIRE</text>
  <text class="body" x="474" y="482">Open-role velocity</text>
  <text class="code" x="474" y="504">count &gt;= 3 is strong</text>
  <rect class="card" x="810" y="415" width="310" height="96" rx="12"/>
  <rect x="834" y="437" width="76" height="24" rx="12" fill="#d97706"/>
  <text class="pill" x="854" y="454">TECH</text>
  <text class="body" x="834" y="482">Relevant stack detected</text>
  <text class="code" x="834" y="504">present === true</text>
  <rect x="1158" y="415" width="140" height="96" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text class="body" x="1180" y="448">Cache-first</text>
  <text class="code" x="1180" y="472">apiCache</text>
  <text class="small" x="1180" y="494">No synthetic writes</text>

  <rect class="lane" x="60" y="590" width="1280" height="160" rx="14"/>
  <text class="stepTitle" x="90" y="630">3. SCORE: apply the pure convergence rule</text>
  <text class="body" x="90" y="660">The scoring function is intentionally boring: no Convex imports, unit-tested, and easy to reason about.</text>
  <text class="code" x="90" y="690">decide({ funding, hiring, tech }) -> { score, confidence, abstained, rationale, rubric }</text>
  <rect x="870" y="625" width="188" height="70" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text class="body" x="894" y="654">Route</text>
  <text class="code" x="894" y="676">&gt;=2 legs + confidence</text>
  <rect x="1090" y="625" width="188" height="70" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
  <text class="body" x="1114" y="654">Abstain</text>
  <text class="code" x="1114" y="676">&lt;2 legs or low conf</text>

  <rect class="lane" x="60" y="790" width="1280" height="140" rx="14"/>
  <text class="stepTitle" x="90" y="830">4. ACT + OBSERVE: action waits for a human, UI updates from queries</text>
  <text class="body" x="90" y="860">Routed accounts create pending Slack/CRM actions. Abstained accounts become first-class board cards.</text>
  <text class="code" x="90" y="890">scores -> liveBoard -> ContentWhiteboard / ContentNode / AbstainCard</text>
  <rect x="970" y="824" width="148" height="52" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="body" x="994" y="855">Approve</text>
  <rect x="1140" y="824" width="148" height="52" rx="9" fill="#fee2e2" stroke="#fca5a5"/>
  <text class="body" x="1164" y="855">Block</text>

  <path class="arrowBlue" d="M700 270 L700 310"/>
  <path class="arrowGreen" d="M400 511 C400 560 600 548 600 590"/>
  <path class="arrowGreen" d="M605 511 C605 560 660 548 660 590"/>
  <path class="arrowGreen" d="M965 511 C965 560 720 548 720 590"/>
  <path class="arrowAmber" d="M700 750 L700 790"/>

  <rect x="84" y="952" width="1232" height="42" rx="10" fill="#ffffff" stroke="#d5dce7"/>
  <text class="small" x="110" y="978">Debug heuristic: if a case disappears, check the next expected table in order: signalEvents, runs, traces, companies.enrichment.legs, scores, actions, then board query shape.</text>
</svg>
