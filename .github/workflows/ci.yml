name: CI

on:
  push:
    branches: [beachhead, master]
  pull_request:
    branches: [beachhead, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horizon
    env:
      # Placeholder so the Convex client provider instantiates during `next build`
      # page-data collection. CI does not connect to a deployment.
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: horizon/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Lint (0 errors required)
        run: npx eslint convex/ app/ --quiet
      - name: Build
        run: npx next build
